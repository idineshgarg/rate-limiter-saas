server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback for client-side routing (react-router-dom). The backend
    # API lives on its own hostname (see VITE_API_URL) rather than being
    # proxied from here.
    location / {
        try_files $uri /index.html;
    }
}
